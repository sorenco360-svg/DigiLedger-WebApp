<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DigiLedger</title>
<meta name="theme-color" content="#0F5E66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--p:#0F5E66;--pt:#fff;--bg:#F6F5F0;--card:#fff;--tx:#1D2B2E;--mu:#68777A;--bd:#E3E1D8;--g:#1E8E5A;--r:#C0392B;--soft:#E6F0F0;--sh:0 1px 3px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08);color-scheme:light}
:root[data-dark="1"]{--p:#4FB3BD;--pt:#0B1B1D;--bg:#121A1B;--card:#1B2628;--tx:#E8EEEE;--mu:#93A4A6;--bd:#2C3A3C;--g:#4CC08A;--r:#EE7B6E;--soft:#223437;--sh:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media(min-width:520px){body{background:#d9d8d1}:root[data-dark="1"] body{background:#05090a}#app{box-shadow:0 0 30px rgba(0,0,0,.25)}}
#mainwrap{flex:1;position:relative;min-height:0}
#main{position:absolute;inset:0;overflow-y:auto}
.screen{padding:16px 16px 32px;animation:fade .25s}
.screen.list{padding-bottom:96px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);display:block;width:100%;text-align:left;color:inherit;border:0;font:inherit}
.card.soft{background:var(--soft);border:1px solid var(--bd)}
.card.b{border:1px solid var(--bd)}
.card.stripe{padding:0;display:flex;overflow:hidden}
.card.stripe .bar{width:5px;flex:none}.card.stripe .in{padding:16px;flex:1;min-width:0}
.card.click{cursor:pointer}
.bubble{width:86%}
.bubble.recv{margin-right:auto;border-bottom-left-radius:4px}
.bubble.give{margin-left:auto;flex-direction:row-reverse;border-bottom-right-radius:4px}
.lbl{color:var(--mu);font-size:14px}
.big{font-size:30px;font-weight:700;margin-top:4px}
.sec{font-weight:700;margin:18px 0 8px}
.card .sec{margin:0}
.row{display:flex;align-items:center;gap:8px}.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu)}.b7{font-weight:700}.sb{font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--p);font:500 16px 'DM Sans',sans-serif;cursor:pointer;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--p);color:var(--pt);border-color:var(--p)}
.btn.sel{background:var(--soft);color:var(--p);border-color:var(--p)}
.btn.danger{color:var(--r)}
.btn.dprim{background:var(--r);color:var(--pt);border-color:var(--r)}
.btn.gprim{background:var(--g);color:var(--pt);border-color:var(--g)}
.btn.full{width:100%}.btn.f1{flex:1}
.ib{width:48px;height:48px;border:0;background:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ib.s40{width:40px;height:40px}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--soft)}
.track{height:10px;border-radius:5px;background:var(--bd);overflow:hidden}.track i{display:block;height:100%;border-radius:5px}
.empty{text-align:center;color:var(--mu);padding:32px 8px}
.fl{font-size:13px;color:var(--mu);margin:12px 0 4px}
input,textarea{width:100%;font:16px 'DM Sans',sans-serif;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;outline:none;min-height:56px;display:block}
input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
input::placeholder,textarea::placeholder{color:var(--mu)}
.err{color:var(--r);font-size:13px;margin-top:8px;min-height:18px}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;border:0;background:var(--p);color:var(--pt);font-size:34px;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom));flex:none}
nav button{flex:1;border:0;background:none;color:var(--mu);font:11px 'DM Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0;min-width:0}
nav button i{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--p);font-weight:500}nav button.on i{background:var(--p);color:var(--pt)}
.ledgerbar{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -2px 8px rgba(0,0,0,.12);flex:none}
.circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pill{display:flex;align-items:center;background:var(--soft);border-radius:12px;padding:6px 4px 6px 12px;margin-bottom:12px;font-size:14px}
.link{background:none;border:0;color:var(--p);font:500 16px 'DM Sans',sans-serif;min-height:48px;padding:0 12px;cursor:pointer}
#ov{position:absolute;inset:0;z-index:20;display:none}
#ov.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;padding:6px 4px 0 16px}.sheet .hd h2{flex:1;margin:0;font-size:18px}
.sheet .bd{padding:8px 16px 12px;overflow-y:auto;flex:1}
.sheet .ft{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.sheet .pad{height:calc(12px + env(safe-area-inset-bottom))}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--card);border-radius:20px;padding:24px;animation:fade .2s}
.dlg h3{margin:0 0 16px;font-size:22px;font-weight:700}.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.sug{border:1px solid var(--bd);border-radius:12px;margin-top:6px;overflow:hidden}
.sug div{padding:13px 12px;min-height:48px;cursor:pointer;border-top:1px solid var(--bd)}.sug div:first-child{border-top:0}
.catrow{display:flex;align-items:center;border-bottom:1px solid var(--bd)}.catrow span{flex:1;padding:10px 0}
#toast{position:absolute;left:16px;right:16px;bottom:96px;background:#323232;color:#fff;border-radius:8px;padding:14px 16px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.sw{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--mu);padding:6px;border-radius:16px}
.sw svg{width:18px;height:18px}
.sw .tr{width:44px;height:24px;border-radius:12px;background:var(--bd);position:relative;transition:background .2s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .2s}
.sw[aria-checked="true"]{color:var(--p)}
.sw[aria-checked="true"] .tr{background:var(--p)}
.sw[aria-checked="true"] .tr::after{left:23px;background:var(--pt)}
.sw:focus-visible{outline:2px solid var(--p)}
select{font:16px 'DM Sans',sans-serif;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:0 12px;min-height:48px;outline:none}
select:focus{border-color:var(--p)}
.mt{width:100%;border-collapse:collapse;font-size:13px;min-width:300px}
.mt th{text-align:right;color:var(--mu);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--bd)}
.mt td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--bd)}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt tfoot td{font-weight:700;color:var(--p);border-bottom:0;border-top:2px solid var(--p)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px;flex:none}
.edited{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--p);margin-top:3px}
.edited svg{width:12px;height:12px;flex:none}
.copyright{position:absolute;left:0;right:0;bottom:0;z-index:4;text-align:center;font-size:12px;color:var(--mu);padding:10px 16px;background:var(--bg)}
.seg{display:flex;gap:6px;padding:10px 0}
.dtw{position:relative}
.dtw input{padding-right:48px}
</style>
</head>
<body>
<div id="app">
  <div id="mainwrap"><div id="main"></div><div id="fabhost"></div></div>
  <div id="navhost"></div>
  <div id="ov"></div>
  <div id="toast"></div>
</div>
<script>
"use strict";
/* ================= Data & helpers ================= */
const DEFAULT_INCOME_CATS=["Aadhar Services","Cash Withdrawal & Deposit","Govt Schemes Apply","Job Apply","Lamination","LL, DL Services","Mobile & DTH Recharge","PAN Services","Passport Photo","Print","ServicePlus","Voter ID","Xerox"];
const DEFAULT_EXPENSE_CATS=["Electricity Bill","Paper & Toner","Shop Rent","Tea & Snacks","Wifi Bill","Staff Salary"];
const GIVE="give",RECV="recv",PREFIX="test_";
const KIND={income:{title:"Income",lc:"income"},expense:{title:"Expenditure",lc:"expenditure"}};
const KEY="csc_exp_tracker_data";
const blank=()=>({income:{tx:[],cats:[...DEFAULT_INCOME_CATS]},expense:{tx:[],cats:[...DEFAULT_EXPENSE_CATS]},customers:[],lastDeleted:[],hideDue:false,reminderAt:null,lastUpdated:null,theme:"system",account:null});
let D=blank();
/* Data lives in IndexedDB (no 5 MB limit). Older data in localStorage is moved over on first start.
   If IndexedDB is unavailable, localStorage is used; if neither works, the app runs without saving. */
const DB={db:null,mode:"none"};
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no indexedDB"));
  const q=indexedDB.open("exp_tracker",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error("blocked"))})}
function idbDo(mode,fn){return new Promise((res,rej)=>{const tx=DB.db.transaction("kv",mode);const r=fn(tx.objectStore("kv"));
  tx.oncomplete=()=>res(r&&r.result);tx.onerror=tx.onabort=()=>rej(tx.error||new Error("transaction failed"))})}
function lsRead(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function lsWorks(){try{localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t");return true}catch(e){return false}}
async function load(){
  try{
    DB.db=await idbOpen();DB.mode="idb";
    let d=await idbDo("readonly",st=>st.get("data"));
    /* first start after the update: copy the old localStorage data in (the old copy is left as a backup) */
    if(!d){const old=lsRead();if(old){await idbDo("readwrite",st=>st.put(old,"data"));d=old}}
    if(d)D=Object.assign(blank(),d);
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){
    DB.db=null;DB.mode=lsWorks()?"ls":"none";const old=lsRead();if(old)D=Object.assign(blank(),old);
    if(DB.mode==="none")setTimeout(()=>toast("Storage isn’t available here, so changes won’t be saved. Open the app from its web address."),300);
  }
}
/* Writes are queued: only one runs at a time, and the latest data is always written last. */
let saving=false,pending=false;
function save(){
  if(DB.mode==="idb"){pending=true;if(!saving)flush()}
  else if(DB.mode==="ls"){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Could not save data (storage full?)")}}
}
async function flush(){saving=true;
  while(pending){pending=false;
    try{await idbDo("readwrite",st=>st.put(D,"data"))}
    catch(e){toast(e&&e.name==="QuotaExceededError"?"Could not save: this device’s storage is full.":"Could not save data.");break}}
  saving=false}
function update(f,touch){f(D);if(touch)D.lastUpdated=new Date().toISOString();save();render();gdSchedule()}
const PAGE=100;
const S={lim:{income:PAGE,expense:PAGE},dlim:PAGE,tab:"dash",open:null,iv:null,ev:null,q:"",sort:"az",svc:"monthly",exp:"monthly"};
const p2=n=>String(n).padStart(2,"0");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ISO=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
const now=()=>ISO(new Date());
const pd=s=>{const[a,b]=s.slice(0,16).split("T");const[y,m,d]=a.split("-").map(Number);const[h,mi]=b.split(":").map(Number);return new Date(y,m-1,d,h,mi)};
const fd=d=>`${p2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`;
const ft=d=>{let h=d.getHours()%12||12;return `${p2(h)}:${p2(d.getMinutes())} ${d.getHours()>=12?"pm":"am"}`};
const fmt=s=>{try{const d=pd(s);return fd(d)+", "+ft(d)}catch(e){return s}};
const dayKey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const inr=n=>"₹"+new Intl.NumberFormat("en-IN",{maximumFractionDigits:2,minimumFractionDigits:0}).format(n);
const plain=n=>String(+n);
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const inRange=(dt,a,b)=>{const k=dt.slice(0,10);return k>=dayKey(a)&&k<dayKey(b)};
const MAX_RANGE_DAYS=31; /* longest Custom Date period in Income / Expenditure */
const pDay=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function range(view){const n=today0();
  if(view&&view.startsWith("custom:")){const[a,b]=view.slice(7).split(":");return[pDay(a),addDays(pDay(b),1)]}
  if(view==="weekly"){const s=addDays(n,-((n.getDay()+6)%7));return[s,addDays(s,7)]}
  if(view==="monthly"){return[new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1)]}
  if(view==="yearly"){return[new Date(n.getFullYear(),0,1),new Date(n.getFullYear()+1,0,1)]}
  return null}
const newId=()=>Date.now().toString(36)+Array.from({length:4},()=>"0123456789abcdefghijklmnopqrstuvwxyz"[Math.random()*36|0]).join("");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bal=c=>c.txs.reduce((a,t)=>a+(t.type===GIVE?t.amt:-t.amt),0);
const lastAct=c=>{const m=c.txs.map(t=>t.dt).sort().pop();return m?(m>c.created?m:c.created):c.created};
const sum=a=>a.reduce((x,y)=>x+y,0);
/* An edited entry keeps the date it had before its first edit (orig) and when it was last edited (edited). */
function markEdit(t,changed){if(!changed)return;if(!t.orig)t.orig=t.dt;t.edited=now()}
/* Entry date as usual; an edited entry adds a short "Edited on …" note, plus "Date changed from …" only when its date was changed */
/* short date for these notes: "21 Nov, 03:01 am" (year added only when it isn't this year) */
const fmtShort=s=>{try{const d=pd(s);return `${p2(d.getDate())} ${MON[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}, ${ft(d)}`}catch(e){return s}};
function dateLines(t){const d='<div class="mu" style="font-size:13px;margin-top:2px">'+fmt(t.dt)+"</div>";if(!t.edited)return d;
  return d+`<div class="edited">${svg("edit")}Edited ${fmtShort(t.edited)}</div>`+(t.orig&&t.orig!==t.dt?`<div class="mu" style="font-size:12px;margin-top:1px">Date was ${fmtShort(t.orig)}</div>`:"")}
const cust=id=>D.customers.find(c=>c.id===id);
const ICON={
 dash:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
 income:'<path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/>',
 expense:'<path d="M12 20V8m0 0l-5 5m5-5l5 5M5 4h14"/>',
 due:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM9 9h6M9 13h6"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
 cats:'<path d="M7 3l4 7H3z" style="fill:currentColor;stroke:none"/><circle cx="17" cy="17" r="4" style="fill:currentColor;stroke:none"/><rect x="3" y="14" width="7" height="7" rx="1" style="fill:currentColor;stroke:none"/>',
 sort:'<path d="M4 7h16M4 12h11M4 17h7"/>',
 dl:'<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
 wa:'<path d="M20 11.5a8.5 8.5 0 0 1-12.4 7.5L3.5 20l1.1-3.9A8.5 8.5 0 1 1 20 11.5z"/><path d="M9 8.5c0 3.2 2.8 6 6 6l1-1.3-1.8-1-.9.8a4.6 4.6 0 0 1-2.3-2.3l.8-.9-1-1.8z" style="fill:currentColor;stroke:none"/>',
 swap:'<path d="M7 4v14m0 0l-3-3m3 3l3-3M17 20V6m0 0l-3 3m3-3l3 3"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.5 7.6A16.6 16.6 0 0 0 2 12s4 7 10 7a9.7 9.7 0 0 0 4-.9"/>',
 back:'<path d="M19 12H5m0 0l6-6m-6 6l6 6"/>',
 close:'<path d="M6 6l12 12M18 6L6 18"/>',
 more:'<circle cx="12" cy="5" r="1.4" style="fill:currentColor"/><circle cx="12" cy="12" r="1.4" style="fill:currentColor"/><circle cx="12" cy="19" r="1.4" style="fill:currentColor"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 user:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.5-2.5 3.2-3.5 5.5-3.5s4 1 5.5 3.5"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',
 cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 8.6 4.7 4.7 0 0 1 17.5 18z"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'};
const svg=(n,cls="")=>`<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const ib=(act,icon,color,label,arg="",cls="")=>`<button class="ib ${cls}" style="color:var(--${color})" data-act="${act}" data-arg="${esc(arg)}" aria-label="${label}">${svg(icon)}</button>`;
const btn=(txt,act,{kind="",arg="",icon="",cls=""}={})=>`<button class="btn ${kind} ${cls}" data-act="${act}" data-arg="${esc(arg)}">${icon?svg(icon):""}${txt}</button>`;
const money=n=>D.hideDue?"₹ ••••":inr(n);

/* ================= Theme / toast / overlay ================= */
const mq=matchMedia("(prefers-color-scheme: dark)");
/* theme "system" (the default) follows the device's light/dark setting; the Dashboard switch can override it with "dark" or "light" */
const isDark=()=>D.theme==="dark"||(D.theme!=="light"&&mq.matches);
function applyTheme(){const dark=isDark();document.documentElement.dataset.dark=dark?"1":"0";document.querySelector('meta[name=theme-color]').content=dark?"#121A1B":"#0F5E66"}
mq.addEventListener?.("change",()=>{S._keepScroll=true;render()});
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000)}
const ov=document.getElementById("ov");
function closeOv(){ov.classList.remove("show");ov.innerHTML="";}
function sheet(title,body,footer,mount){
  ov.innerHTML=`<div class="scrim" data-act="closeov"></div><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="hd"><h2>${esc(title)}</h2>${ib("closeov","close","mu","Close")}</div><div class="bd">${body}</div>${footer?`<div class="ft">${footer}</div>`:'<div class="pad"></div>'}</div>`;
  ov.classList.add("show");mount&&mount(ov)}
function confirmDlg(msg,fn,text="Delete"){
  ov.innerHTML=`<div class="scrim" data-act="closeov"></div><div class="dlg" role="alertdialog"><h3>Please confirm</h3><div>${esc(msg)}</div><div class="acts"><button class="btn" data-act="closeov">Cancel</button><button class="btn primary" id="cfok">${esc(text)}</button></div></div>`;
  ov.classList.add("show");document.getElementById("cfok").onclick=()=>{closeOv();fn()}}

/* ================= Screens ================= */
function render(){
  applyTheme();
  const main=document.getElementById("main"),nh=document.getElementById("navhost");
  const ledger=S.tab==="due"?cust(S.open):null;
  const st=main.scrollTop;
  main.innerHTML=S.tab==="dash"?dashboard():S.tab==="income"?book("income"):S.tab==="expense"?book("expense"):S.tab==="due"?(ledger?ledgerScreen(ledger):dueScreen()):settings();
  if(S._keepScroll){main.scrollTop=st}else main.scrollTop=ledger?main.scrollHeight:0;S._keepScroll=false;
  /* keep the + button fixed to the bottom-right corner, outside the scrolling content */
  /* the same layer keeps the Settings copyright line pinned to the bottom */
  const fh=document.getElementById("fabhost");fh.innerHTML="";main.querySelectorAll(".fab,.copyright").forEach(el=>fh.appendChild(el));
  if(ledger){nh.innerHTML=`<div class="ledgerbar">${btn("Received (Paid)","recv",{kind:"gprim f1"})}${btn("Give (Due)","give",{kind:"dprim f1"})}</div>`}
  else{const T=[["dash","Dashboard"],["income","Income"],["expense","Expenditure"],["due","Due"],["settings","Settings"]];
    nh.innerHTML=`<nav${S.tab==="settings"?' style="border-top-color:transparent"':""}>${T.map(([t,l])=>`<button class="${S.tab===t?"on":""}" data-act="tab" data-arg="${t}"><i>${svg(t)}</i><span>${l}</span></button>`).join("")}</nav>`}
}
const pct=(c,p)=>p===0?(c===0?0:c>0?100:-100):(c-p)/Math.abs(p)*100;
const topShares=l=>{const m={};l.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);const tot=sum(Object.values(m));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>[k,v/tot*100])};
function shares(list,color){if(!list.length)return `<div class="empty">No data for this period.</div>`;
  return list.map(([n,p])=>`<div style="margin-top:12px"><div class="row" style="margin-bottom:6px"><span class="grow">${esc(n)}</span><b>${p.toFixed(1)}%</b></div><div class="track"><i style="width:${Math.min(100,Math.max(0,p))}%;background:var(--${color})"></i></div></div>`).join("")}
const seg=(cur,act)=>`<div class="seg">${[["weekly","Weekly"],["monthly","Monthly"],["yearly","Yearly"]].map(([v,l])=>btn(l,act,{kind:"f1 "+(cur===v?"sel":""),arg:v})).join("")}</div>`;
function dashboard(){
  const inc=(a,b)=>sum(D.income.tx.filter(t=>inRange(t.dt,a,b)).map(t=>t.amt));
  const exp=(a,b)=>sum(D.expense.tx.filter(t=>inRange(t.dt,a,b)).map(t=>t.amt));
  const due=(a,b)=>sum(D.customers.flatMap(c=>c.txs.filter(t=>t.type===GIVE&&inRange(t.dt,a,b))).map(t=>t.amt));
  /* due cleared = Received (Paid) due entries in the period */
  const cleared=(a,b)=>sum(D.customers.flatMap(c=>c.txs.filter(t=>t.type===RECV&&inRange(t.dt,a,b))).map(t=>t.amt));
  /* Net Profit = (Income + Due Cleared) − (Due + Expenditure) */
  const net=(a,b)=>inc(a,b)+cleared(a,b)-(due(a,b)+exp(a,b));
  const t=today0(),t1=addDays(t,1);
  const i=inc(t,t1),e=exp(t,t1),du=due(t,t1),dc=cleared(t,t1),np=(i+dc)-(du+e),up=i>e;
  const m=new Date(t.getFullYear(),t.getMonth(),1);
  const M=(d,k)=>new Date(d.getFullYear(),d.getMonth()+k,1);
  const cmp=[["Today vs Previous Day",net(t,t1),net(addDays(t,-1),t)],["This Month vs Previous Month",net(m,M(m,1)),net(M(m,-1),m)]];
  const[sa,sb]=range(S.svc),[ea,eb]=range(S.exp);
  const dues=D.customers.map(c=>[c.name,bal(c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const totalDue=sum(dues.map(x=>x[1]));
  const bar=(l,v,mx,a)=>`<div class="row" style="margin-top:8px"><span class="mu" style="width:64px;font-size:13px">${l}</span><div class="track grow"><i style="width:${Math.min(100,Math.abs(v)/mx*100)}%;background:var(--${v>=0?"g":"r"});opacity:${a}"></i></div><span style="font-size:13px;max-width:130px">${inr(v)}</span></div>`;
  return `<div class="screen">
  <div class="card soft" style="position:relative"><button class="sw" role="switch" aria-checked="${isDark()}" aria-label="Dark mode" title="Dark mode" data-act="darkmode">${svg("moon")}<span class="tr"></span></button><div class="lbl">Today’s Revenue</div><div class="row" style="margin-top:6px"><div class="circle" style="width:40px;height:40px;font-size:26px;background:var(--${up?"g":"r"});color:var(--pt)">${up?"+":"−"}</div><span style="font-size:30px;font-weight:700;margin-left:0">${inr(i+du)}</span></div><div class="lbl" style="margin-top:8px">${D.lastUpdated?"Last Updated at "+ft(new Date(D.lastUpdated)):"No updates yet"}</div></div>
  <div class="sec">Today’s Business</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[["Today’s Income",i,"g"],["Today’s Expenditure",e,"r"],["Today’s Due",du,"tx"],["Due Cleared Today",dc,"g"]].map(([l,v,c])=>`<div class="card" style="padding:12px"><div class="lbl">${l}</div><div class="b7" style="margin-top:4px;color:var(--${c})">${inr(v)}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:8px"><div class="lbl">Today’s Net Profit</div><div class="big" style="color:var(--${np>=0?"g":"r"})">${np<0?"− ":""}${inr(Math.abs(np))}</div></div>
  <div class="sec">Profit &amp; Loss Comparison</div>
  ${cmp.map(([l,c,p])=>{const g=pct(c,p),mx=Math.max(Math.abs(c),Math.abs(p),1);return `<div class="card" style="margin-bottom:8px"><div class="row top"><span class="lbl grow">${l}</span><b style="color:var(--${g>=0?"g":"r"})">${g>=0?"▲":"▼"} ${Math.abs(g).toFixed(1)}%</b></div>${bar("Current",c,mx,1)}${bar("Previous",p,mx,.45)}</div>`}).join("")}
  <div class="card" style="margin-top:8px"><div class="sec">Top Services</div><div class="lbl">Share of Revenue</div>${seg(S.svc,"svc")}${shares(topShares(D.income.tx.filter(t=>inRange(t.dt,sa,sb))),"p")}</div>
  <div class="card" style="margin-top:12px"><div class="sec">Top Expenses</div><div class="lbl">Share of Expenses</div>${seg(S.exp,"expp")}${shares(topShares(D.expense.tx.filter(t=>inRange(t.dt,ea,eb))),"r")}</div>
  <div class="card" style="margin-top:12px"><div class="sec">Top Dues</div><div class="lbl">Share of Total Due</div>${shares(dues.slice(0,5).map(x=>[x[0],x[1]/totalDue*100]),"r")}</div>
  </div>`}

function filterTx(tx,view){const r=range(view);return tx.filter(t=>!r||inRange(t.dt,r[0],r[1])).sort((a,b)=>b.dt.localeCompare(a.dt))}
function periodLabel(tx,view){const r=range(view);if(r)return fd(r[0])+" – "+fd(addDays(r[1],-1));if(!tx.length)return "All transactions";const s=tx.map(t=>t.dt).sort();return fd(pd(s[0]))+" – "+fd(pd(s[s.length-1]))}
function book(k){
  const b=D[k],view=k==="income"?S.iv:S.ev,list=filterTx(b.tx,view),acc=k==="income"?"g":"r",td=dayKey(new Date());
  const tt=sum(b.tx.filter(t=>t.dt.slice(0,10)===td).map(t=>t.amt));
  return `<div class="screen list">
  <div class="card soft"><div class="lbl">Today’s ${KIND[k].title}</div><div class="big" style="color:var(--${acc})">${inr(tt)}</div></div>
  <div class="row" style="padding:14px 0">${btn("Categories","cats",{arg:k,icon:"cats",cls:"",kind:""}).replace('class="btn  "','class="btn" style="flex:1.25"')}${btn("Sort","sort",{arg:k,icon:"sort",cls:"f1"})}${btn("Export","export",{arg:k,icon:"dl",cls:"f1"})}</div>
  ${view?`<div class="pill"><div class="grow"><div>${view==="weekly"?"This week":view==="monthly"?"This month":"Custom date"}: ${periodLabel(b.tx,view)}</div><div>Total: <b style="color:var(--${acc})">${inr(sum(list.map(t=>t.amt)))}</b></div></div><button class="link" data-act="clearview" data-arg="${k}">Clear</button></div>`:""}
  ${list.length?list.slice(0,S.lim[k]).map(t=>`<div class="card" style="margin-bottom:10px"><div class="row top"><span class="grow sb">${esc(t.cat)}</span><b style="color:var(--${acc});margin-left:12px">${k==="expense"?"– ":""}${inr(t.amt)}</b></div><div class="row top" style="margin-top:6px"><div class="grow">${dateLines(t)}${t.rem?`<div style="font-size:14px;margin-top:6px">${esc(t.rem)}</div>`:""}</div>${ib("edittx","edit","p","Edit",k+"|"+t.id)}${ib("deltx","trash","r","Delete",k+"|"+t.id)}</div></div>`).join("")+more(list.length-S.lim[k],"more",k):`<div class="empty">No ${KIND[k].lc} transactions yet.</div>`}
  <button class="fab" data-act="addtx" data-arg="${k}" aria-label="Add">+</button></div>`}

function sortCust(l,m){return m==="hi"?[...l].sort((a,b)=>bal(b)-bal(a)):m==="lo"?[...l].sort((a,b)=>bal(a)-bal(b)):m==="tm"?[...l].sort((a,b)=>lastAct(b).localeCompare(lastAct(a))):[...l].sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()))}
const more=(left,act,arg="")=>left>0?`<button class="btn full" style="margin-bottom:10px" data-act="${act}" data-arg="${arg}">Show more (${left} more)</button>`:"";
function dueList(){const q=S.q.trim().toLowerCase();const l=sortCust(D.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||c.mob.includes(q)),S.sort);
  return l.length?l.slice(0,S.dlim).map(c=>{const b=bal(c);return `<button class="card click" style="margin-bottom:10px;min-height:56px" data-act="opencust" data-arg="${c.id}"><div class="row"><span class="grow sb">${esc(c.name)}</span><b style="color:var(--${b>0?"r":"g"})">${money(b)}</b></div></button>`}).join("")+more(l.length-S.dlim,"moredue"):`<div class="empty">${D.customers.length?"No matching customers.":"No customers yet."}</div>`}
function dueScreen(){
  return `<div class="screen list">
  <div class="row" style="margin-bottom:12px"><input id="dq" placeholder="Search" value="${esc(S.q)}" autocomplete="off"><button class="btn" style="width:48px;min-height:48px;padding:0;color:var(--tx)" data-act="duemenu" aria-label="Menu">${svg("more")}</button></div>
  <div class="card soft"><div class="lbl">Total Due Amount</div><div class="row"><div class="big grow r">${money(sum(D.customers.map(bal)))}</div>${ib("hide",D.hideDue?"eyeoff":"eye","p","Show or hide amounts")}</div></div>
  <div class="row" style="padding:14px 0">${btn("Sort","duesort",{icon:"sort",cls:"f1"})}${btn("Export","duesx",{icon:"dl",cls:"f1"})}</div>
  <div id="dlist">${dueList()}</div>
  <button class="fab" data-act="addcust" aria-label="Register customer">+</button></div>`}
function ledgerScreen(c){
  const b=bal(c);let r=0;const hist=[...c.txs].sort((a,b)=>a.dt.localeCompare(b.dt)).map(t=>{r+=t.type===GIVE?t.amt:-t.amt;return[t,r]});
  return `<div class="screen">
  <div class="card"><div class="row">${ib("back","back","mu","Back","","s40")}<div class="grow" style="padding-left:4px"><div class="sb">${esc(c.name)}</div><div class="mu" style="font-size:13px">${esc(c.mob)}</div></div>${ib("wa","wa","g","WhatsApp reminder","","s40")}${ib("ledpdf","dl","p","Export PDF","","s40")}${ib("editcust","edit","p","Edit customer","","s40")}${ib("delcust","trash","r","Delete customer","","s40")}</div><div class="lbl" style="margin-top:12px">Current Balance</div><div class="big" style="color:var(--${b>0?"r":"g"})">${inr(b)}</div></div>
  <div style="height:14px"></div>
  ${hist.length?hist.map(([t,run])=>{const col=t.type===GIVE?"r":"g";return `<div class="card stripe bubble ${t.type}" style="margin-bottom:10px"><div class="bar" style="background:var(--${col})"></div><div class="in"><div class="row top"><div class="grow"><div class="sb">${t.type===GIVE?"Given (Due)":"Received (Paid)"}</div>${dateLines(t)}</div><b style="color:var(--${col});margin-left:12px">${t.type===GIVE?"+ ":"– "}${inr(t.amt)}</b></div><div class="row" style="margin-top:6px"><div class="grow">${t.rem?`<div style="font-size:14px;margin-bottom:4px">${esc(t.rem)}</div>`:""}<div class="mu" style="font-size:13px">Balance: ${inr(run)}</div></div>${ib("editdue","edit","p","Edit",t.id,"s40")}${ib("deldue","trash","r","Delete",t.id,"s40")}</div></div></div>`}).join(""):`<div class="empty">No transactions yet.</div>`}
  </div>`}
/* ================= ITR Summary (financial year: 1 April – 31 March) ================= */
const FY_MON=["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
const fyStartOf=dt=>{const y=+dt.slice(0,4),m=+dt.slice(5,7);return m>=4?y:y-1};
const fyLabel=s=>`FY ${s}-${String((s+1)%100).padStart(2,"0")}`;
const fyRange=s=>[new Date(s,3,1),new Date(s+1,3,1)];
function fyList(){const set=new Set([fyStartOf(now())]);
  [...D.income.tx,...D.expense.tx,...D.customers.flatMap(c=>c.txs)].forEach(t=>set.add(fyStartOf(t.dt)));
  return[...set].sort((a,b)=>b-a)}
function fyData(s){
  const[a,b]=fyRange(s),inF=t=>inRange(t.dt,a,b);
  const inc=D.income.tx.filter(inF),exp=D.expense.tx.filter(inF),dtx=D.customers.flatMap(c=>c.txs).filter(inF);
  const gross=sum(inc.map(t=>t.amt)),expTot=sum(exp.map(t=>t.amt));
  const cleared=sum(dtx.filter(t=>t.type===RECV).map(t=>t.amt)),credit=sum(dtx.filter(t=>t.type===GIVE).map(t=>t.amt));
  const endKey=dayKey(b),ongoing=b>new Date();
  /* money customers still owe at the end of the FY (or today, while the FY is running) */
  const outstanding=sum(D.customers.map(c=>c.txs.filter(t=>t.dt.slice(0,10)<endKey).reduce((x,t)=>x+(t.type===GIVE?t.amt:-t.amt),0)).filter(v=>v>0));
  const months=FY_MON.map((n,i)=>{const ma=new Date(s,3+i,1),mb=new Date(s,4+i,1);
    const mi=sum(inc.filter(t=>inRange(t.dt,ma,mb)).map(t=>t.amt)),me=sum(exp.filter(t=>inRange(t.dt,ma,mb)).map(t=>t.amt));
    return{name:n+" "+ma.getFullYear(),inc:mi,exp:me,profit:mi-me}});
  const top=list=>{const m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);const tot=sum(Object.values(m));return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([k,v])=>[k,v,tot?v/tot*100:0])};
  return{s,label:fyLabel(s),from:a,to:addDays(b,-1),ongoing,inc,exp,gross,expTot,net:gross-expTot,cleared,credit,outstanding,months,topInc:top(inc),topExp:top(exp)}}
function itrCard(){
  const list=fyList();if(S.fy==null||!list.includes(S.fy))S.fy=list[0];
  return `<div class="card" style="margin-top:12px;padding:12px 12px 12px 14px">
  <div class="row" style="gap:12px"><div class="circle" style="width:38px;height:38px;background:var(--soft);color:var(--p)">${svg("due")}</div>
   <div class="grow"><div class="sb">ITR Summary</div><div class="lbl" style="font-size:12px">Summary of your entries, not tax advice.</div></div></div>
  <div class="row" style="margin-top:10px;gap:6px"><select id="fysel" class="grow" style="min-height:40px;font-size:15px;min-width:0" aria-label="Financial year">${list.map(s=>`<option value="${s}"${s===S.fy?" selected":""}>${fyLabel(s)}</option>`).join("")}</select>
   ${btn("Excel","itrxl",{kind:"primary",icon:"dl"}).replace('class="btn primary ','class="btn primary sm ')}${btn("PDF","itrpdf",{icon:"dl"}).replace('class="btn  ','class="btn sm ')}</div>
  </div>`}

/* ---- ITR Excel workbook for the CA ---- */
async function itrReport(s){
  const f=fyData(s);
  const C={teal:"FF0F5E66",tealD:"FF0A454B",soft:"FFE6F0F0",zebra:"FFF7FAFA",bd:"FFD5DCDC",g:"FF1E8E5A",gS:"FFE3F4EB",r:"FFC0392B",rS:"FFFBE9E7",mu:"FF68777A",tx:"FF1D2B2E",w:"FFFFFFFF"};
  const FM='[>=10000000]"₹"##\\,##\\,##\\,##0.00;[>=100000]"₹"##\\,##\\,##0.00;"₹"##,##0.00',FN='"₹"#,##0.00',DF="dd-mmm-yyyy  hh:mm AM/PM";
  const fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}}),thin={style:"thin",color:{argb:C.bd}},box={top:thin,left:thin,bottom:thin,right:thin};
  const money=(x,v)=>{x.value=v;x.numFmt=v<0?FN:FM;x.alignment={horizontal:"right",vertical:"middle"}};
  const xd=v=>{const d=pd(v);return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes()))};
  const each=(ws,r,c1,c2,fn)=>{for(let c=c1;c<=c2;c++)fn(ws.getCell(r,c),c)};
  const band=(ws,r,c1,c2,value,font,bg,h)=>{each(ws,r,c1,c2,x=>x.fill=fill(bg));ws.mergeCells(r,c1,r,c2);const x=ws.getCell(r,c1);x.value=value;x.font=font;x.alignment={vertical:"middle",horizontal:"left",indent:1};if(h)ws.getRow(r).height=h;return x};
  const head=(ws,r,labels,right,bg=C.teal)=>{labels.forEach((l,i)=>{const x=ws.getCell(r,i+1);x.value=l;x.font={bold:true,size:10,color:{argb:C.w}};x.fill=fill(bg);x.border=box;x.alignment={vertical:"middle",horizontal:right.includes(i)?"right":i===0&&l==="#"?"center":"left"}});ws.getRow(r).height=22};
  const page={orientation:"portrait",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:.4,right:.4,top:.5,bottom:.6,header:.3,footer:.3}};
  const footer={oddFooter:`&L&8&K68777ADigiLedger — ITR Summary ${f.label}&R&8&K68777APage &P of &N`};
  const sub=`DigiLedger  ·  ${fd(f.from)} – ${fd(f.to)}${f.ongoing?" (year in progress)":""}  ·  Generated on ${fmt(now())}`;
  const wb=new ExcelJS.Workbook();wb.creator="DigiLedger";wb.created=new Date();

  /* Summary */
  const ws=wb.addWorksheet("Summary",{properties:{tabColor:{argb:C.teal}},views:[{showGridLines:false}],pageSetup:page,headerFooter:footer});
  ws.columns=[24,20,20,20].map(w=>({width:w}));
  band(ws,1,1,4,`ITR Summary — ${f.label}`,{size:20,bold:true,color:{argb:C.w}},C.teal,40);
  band(ws,2,1,4,sub,{size:10,italic:true,color:{argb:"FFCFE6E8"}},C.tealD,20);
  let r=4;
  const kv=[["Gross Receipts (Income)",f.gross,C.g],["Total Expenditure",f.expTot,C.r],["Net Profit",f.net,f.net>=0?C.g:C.r],["Due Cleared during the year",f.cleared,C.g],["Credit given as Due",f.credit,C.tx],[f.ongoing?"Outstanding Dues (till date)":"Outstanding Dues on "+fd(f.to),f.outstanding,f.outstanding>0?C.r:C.g]];
  head(ws,r,["Key figures","","","Amount"],[3]);ws.mergeCells(r,1,r,3);r++;
  kv.forEach(([l,v,col],i)=>{ws.mergeCells(r,1,r,3);ws.getCell(r,1).value=l;money(ws.getCell(r,4),v);
    each(ws,r,1,4,x=>{x.fill=fill(i%2?C.zebra:C.w);x.border=box});ws.getCell(r,1).font={size:11,color:{argb:C.tx}};ws.getCell(r,1).alignment={vertical:"middle",indent:1};
    ws.getCell(r,4).font={size:12,bold:true,color:{argb:col}};ws.getRow(r).height=22;r++});
  if(f.gross){r++;ws.mergeCells(r,1,r,4);const n=ws.getCell(r,1);n.value=`Net profit is ${(f.net/f.gross*100).toFixed(1)}% of gross receipts. Confirm the correct ITR form and scheme with your CA. This is a summary of recorded entries, not tax advice.`;
    n.font={size:9,italic:true,color:{argb:C.mu}};n.alignment={wrapText:true,vertical:"top"};ws.getRow(r).height=30;r++}
  r++;const t=ws.getCell(r,1);t.value="Month-wise";t.font={size:12,bold:true,color:{argb:C.teal}};r++;
  head(ws,r,["Month","Income","Expenditure","Profit"],[1,2,3]);r++;

/* Remarks autofill for every Remarks box: suggests remarks typed earlier anywhere in the app
   (Income, Expenditure, Give and Received entries), most used first. Needs #f_rem and an empty #rsug below it. */
function remarkSuggest(){
  const remEl=document.getElementById("f_rem"),rsug=document.getElementById("rsug");if(!remEl||!rsug)return;
  const freq=new Map(),add=r=>{const k=(r||"").trim();if(k)freq.set(k,(freq.get(k)||0)+1)};
  D.income.tx.forEach(x=>add(x.rem));D.expense.tx.forEach(x=>add(x.rem));D.customers.forEach(cu=>cu.txs.forEach(x=>add(x.rem)));
  const pool=[...freq].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const show=()=>{const q=remEl.value.trim().toLowerCase();if(!q){rsug.innerHTML="";return}
    const seen=new Set(),m=[];
    for(const p of pool){const k=p.toLowerCase();if(seen.has(k)||k===q||!k.includes(q))continue;seen.add(k);m.push(p)}
    m.sort((a,b)=>(b.toLowerCase().startsWith(q))-(a.toLowerCase().startsWith(q)));
    rsug.innerHTML=m.length?`<div class="sug">${m.slice(0,6).map(p=>`<div data-s="${esc(p)}">${esc(p)}</div>`).join("")}</div>`:"";
    rsug.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{remEl.value=e.dataset.s;rsug.innerHTML="";remEl.focus()})};
  remEl.setAttribute("autocomplete","off");remEl.oninput=show}

  const head=(ws,r,labels,right,bg=C.teal)=>{labels.forEach((l,i)=>{const x=ws.getCell(r,i+1);x.value=l;x.font={bold:true,size:10,color:{argb:C.w}};x.fill=fill(bg);x.border=box;x.alignment={vertical:"middle",wrapText:true,horizontal:right.includes(i)?"right":l==="#"?"center":"left"}});ws.getRow(r).height=24};
  const page={orientation:"landscape",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:.4,right:.4,top:.5,bottom:.6,header:.3,footer:.3}};

 ledpdf:()=>{const c=cust(S.open);if(!c.txs.length)return toast("No transactions to export");if(needLibs())savePdf(ledgerPdf(c))},
 give:()=>dueTxForm(GIVE),recv:()=>dueTxForm(RECV),editdue:id=>dueTxForm(cust(S.open).txs.find(t=>t.id===id).type,id),
 deldue:id=>confirmDlg("Delete this transaction?",()=>update(d=>{const c=d.customers.find(c=>c.id===S.open),t=c.txs.find(x=>x.id===id);d.lastDeleted=[{cid:c.id,tx:t}];c.txs=c.txs.filter(x=>x.id!==id)})),
 theme:k=>update(d=>d.theme=k),
 itrxl:async()=>{toast("Preparing report…");try{await loadExcelJS();download(...await itrReport(S.fy))}catch(e){console.error(e);toast("Could not create the report. Check your internet connection.")}},
 itrpdf:()=>{if(!window.jspdf)return toast("Export libraries failed to load. Check your connection.");savePdf(itrPdf(S.fy))},
 /* switching to the same mode as the device goes back to following the device automatically */
 darkmode:()=>{S._keepScroll=true;const want=!isDark();update(d=>d.theme=want===mq.matches?"system":want?"dark":"light")},
 loadsample:()=>{update(d=>{removeSample();d.income.tx.push(...sampleIncome());d.expense.tx.push(...sampleExpense());d.customers.push(...sampleCust())},true);toast("Test data loaded")},
 rmsample:()=>{if(!hasSample())return toast("No test data to remove");confirmDlg("Remove all test entries? Your own entries are not affected.",()=>{update(d=>removeSample());toast("Test data removed")},"Remove")},
 gdon:()=>gdConnect(),gdnow:()=>gdBackup(true),gdrestore:()=>gdRestore()
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset.arg||"")}});
document.addEventListener("change",e=>{if(e.target.id==="fysel"){S.fy=+e.target.value;S._keepScroll=true;render()}});
document.addEventListener("input",e=>{if(e.target.id==="dq"){S.q=e.target.value;S.dlim=PAGE;document.getElementById("dlist").innerHTML=dueList()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ov.classList.contains("show"))closeOv();if(e.key==="Enter"&&e.target.id==="nc")A.addcat(S.tab==="income"?"income":"expense")});
window.addEventListener("popstate",()=>{if(S.tab==="due"&&S.open){S.open=null;render()}});
/* browser back button leaves the ledger, like the Android back handler */
const _render=render;render=function(){_render();if(S.tab==="due"&&S.open&&!history.state?.l){history.pushState({l:1},"")}};
/* reminder check every 15s */
function checkReminder(){const at=D.reminderAt;if(!at)return;if(!(pd(at)>new Date())){update(d=>d.reminderAt=null);toast("Reminder: collect pending dues");try{if("Notification" in window&&Notification.permission==="granted")new Notification("DigiLedger",{body:"Collect pending dues"})}catch(e){}}}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});
load().then(()=>{render();checkReminder();setInterval(checkReminder,15000)});
/* load Google's sign-in script early so tapping Auto Backup opens Google's window straight away */
if(GOOGLE_CLIENT_ID)loadGIS().catch(()=>{});
</script>
